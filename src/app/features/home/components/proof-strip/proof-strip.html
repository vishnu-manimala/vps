<section class="proof-strip" aria-label="Portfolio highlights">
  <div class="proof-label">A FEW THINGS<br>THAT ADD UP <span aria-hidden="true">↘</span></div>
  @for (metric of metrics(); track metric.label) {
    <div class="proof-stat"><strong>{{ metric.value }}</strong><span>{{ metric.label }}</span></div>
  }
  <div class="proof-note">GOOD WORK<br>LEAVES A TRACE.</div>
</section>
