<header class="site-header">
  <a class="brand-lockup" href="#top" [attr.aria-label]="name() + ' home'">
    <img class="brand-mark" src="/vps-mark.svg" alt="" width="48" height="27" fetchpriority="high">
    <span class="brand-name">{{ name().toUpperCase() }}</span>
  </a>

  <button class="theme-toggle" type="button" (click)="theme.toggle()"
    [attr.aria-label]="theme.isDark() ? 'Switch to light theme' : 'Switch to dark theme'"
    [attr.aria-pressed]="theme.isDark()">
    <span class="theme-icon" aria-hidden="true">{{ theme.isDark() ? '☀' : '☾' }}</span>
    <span class="theme-label">{{ theme.isDark() ? 'Light' : 'Dark' }}</span>
  </button>

  <button class="menu-toggle" type="button" (click)="toggleMenu()"
    [attr.aria-expanded]="menuOpen()" aria-controls="primary-nav"
    [attr.aria-label]="menuOpen() ? 'Close menu' : 'Open menu'">
    <span></span><span></span>
  </button>

  <nav id="primary-nav" class="primary-nav" [class.open]="menuOpen()" [class.dark-theme]="theme.isDark()" aria-label="Main navigation">
    <a href="#experience" (click)="closeMenu()">Experience</a>
    <a href="#work" (click)="closeMenu()">Selected work</a>
    <a href="#about" (click)="closeMenu()">About</a>
    <a class="nav-cta" href="#contact" (click)="closeMenu()">Let’s talk <span>↗</span></a>
  </nav>
</header>
